name: Artifact Pages admin
description: Optional thin wrapper for admin registry operations and application deployment.
inputs:
  operation:
    description: "CLI operation: registry-register, registry-unregister, or app-deploy."
    required: false
    default: registry-register
  config:
    description: Optional deployment config path or github:// config locator.
    required: false
    default: ""
  github-token:
    description: Optional token with read-only access to a separate private admin config repository; otherwise uses this workflow's GITHUB_TOKEN.
    required: false
    default: ""
  site:
    description: Explicit site ID, required for registry-unregister.
    required: false
    default: ""
  archive:
    description: Optional local app release archive for app-deploy. Without it, app-deploy downloads the web release that matches the pinned CLI version (the Action ref).
    required: false
    default: ""
  repository:
    description: Owner/repository that publishes the pinned web release (used only when archive is empty).
    required: false
    default: tasuku43/git-artifact-pages
  dry-run:
    description: Plan changes without provider object writes or cache changes.
    required: false
    default: "false"
  publish-on:
    description: "Optional newline-separated list of `event` or `event:ref` entries (for example `push:refs/heads/main`, `workflow_dispatch`). A run that matches none of them becomes a dry-run. An explicit `dry-run: true` always wins; empty means no condition."
    required: false
    default: ""
outputs:
  operation:
    description: CLI operation name.
    value: ${{ steps.cli.outputs.operation }}
  outcome:
    description: CLI outcome string, such as planned, registered, unregistered, deployed, no-op, or failed.
    value: ${{ steps.cli.outputs.outcome }}
  site:
    description: Explicit site ID when the selected operation applies to one site.
    value: ${{ steps.cli.outputs.site }}
  registry-updated:
    description: JSON boolean rendered as true or false when present.
    value: ${{ steps.cli.outputs['registry-updated'] }}
  changes:
    description: JSON array of per-path changes.
    value: ${{ steps.cli.outputs.changes }}
  preview-changes:
    description: JSON array of preview catalog dispositions, when present.
    value: ${{ steps.cli.outputs['preview-changes'] }}
  result:
    description: Complete CLI JSON result object.
    value: ${{ steps.cli.outputs.result }}
  exit-code:
    description: Original artifact-pages CLI exit code as an integer string.
    value: ${{ steps.cli.outputs['exit-code'] }}
  error:
    description: CLI error text when the operation failed.
    value: ${{ steps.cli.outputs.error }}
runs:
  using: composite
  steps:
    - name: Set up Go from the pinned component source
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/../../go.mod
        cache: false
      # setup-go exports GOTOOLCHAIN=local, which makes a later setup-go in the
      # same job ignore go.mod's toolchain line; auto lets each Action honor it.
      env:
        GOTOOLCHAIN: auto
    - name: Build the shared artifact-pages CLI
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: go build -trimpath -o "$RUNNER_TEMP/artifact-pages" ./cli/cmd/artifact-pages
    - name: Run the selected registry or app CLI operation
      id: cli
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ARTIFACT_PAGES_CLI: ${{ runner.temp }}/artifact-pages
        ARTIFACT_PAGES_ACTION_KIND: admin
        ARTIFACT_PAGES_INPUT_OPERATION: ${{ inputs.operation }}
        ARTIFACT_PAGES_INPUT_CONFIG: ${{ inputs.config }}
        ARTIFACT_PAGES_INPUT_SITE: ${{ inputs.site }}
        ARTIFACT_PAGES_INPUT_ARCHIVE: ${{ inputs.archive }}
        ARTIFACT_PAGES_INPUT_REPOSITORY: ${{ inputs.repository }}
        ARTIFACT_PAGES_INPUT_DRY_RUN: ${{ inputs.dry-run }}
        ARTIFACT_PAGES_INPUT_PUBLISH_ON: ${{ inputs.publish-on }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: node "$GITHUB_ACTION_PATH/../shared/invoke-cli.mjs"
