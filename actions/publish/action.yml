name: Artifact Pages site sync
description: Reconcile a registered site's static projection with its Git-managed publishable files.
author: artifact-pages
branding:
  icon: book-open
  color: blue
inputs:
  site:
    description: Explicit registered site ID; never inferred from repository identity.
    required: true
  source:
    description: Publishable source directory inside the checked-out Git repository.
    required: false
    default: ""
  ref:
    description: Source metadata ref to record in the site index; does not select the checkout or source content.
    required: false
    default: ""
  config:
    description: Optional deployment config path or github:// config locator.
    required: false
    default: ""
  cli-version:
    description: Override the config CLI pin with an exact supported release; compatibility checks still run.
    required: false
    default: ""
  github-token:
    description: Optional token with read-only access to a separate private admin config repository; otherwise uses this workflow's GITHUB_TOKEN.
    required: false
    default: ""
  dry-run:
    description: Calculate and report the origin changes without writes.
    required: false
    default: "false"
  publish-on:
    description: "Optional newline-separated list of `event` or `event:ref` entries (for example `push:refs/heads/main`, `workflow_dispatch`). A run that matches none of them becomes a dry-run. An explicit `dry-run: true` always wins; empty means no condition."
    required: false
    default: ""
  summary:
    description: When true (the default), append an operation summary to the GitHub Job Summary, also on failure. The Markdown format is a documented contract.
    required: false
    default: "true"
  checkout:
    description: "auto (default): run actions/checkout when the workspace is not already a Git checkout. true: always check out. false: never.  Uses the workflow token with persist-credentials: false, never the github-token input."
    required: false
    default: auto
  fetch-depth:
    description: "fetch-depth for the Action's own checkout. 1 (the default) is a shallow checkout: the CLI deepens it from origin on demand, so per-document updatedAt and last committer and preview merge-base selection match a full clone, with the byte-identical-commit limit in the specification. 0 fetches full history. Ignored when no checkout runs."
    required: false
    default: "1"
outputs:
  operation:
    description: CLI operation name.
    value: ${{ steps.cli.outputs.operation }}
  outcome:
    description: CLI outcome string, such as planned, synced, no-op, or failed.
    value: ${{ steps.cli.outputs.outcome }}
  site:
    description: Explicit site ID selected for this operation.
    value: ${{ steps.cli.outputs.site }}
  changes:
    description: JSON array of per-path production changes.
    value: ${{ steps.cli.outputs.changes }}
  preview-changes:
    description: JSON array of preview catalog dispositions.
    value: ${{ steps.cli.outputs['preview-changes'] }}
  result:
    description: Complete CLI JSON result object.
    value: ${{ steps.cli.outputs.result }}
  exit-code:
    description: Original artifact-pages CLI exit code as an integer string.
    value: ${{ steps.cli.outputs['exit-code'] }}
  error:
    description: CLI error text when the operation failed.
    value: ${{ steps.cli.outputs.error }}
runs:
  using: composite
  steps:
    - name: Decide whether to check out the repository
      id: checkout-mode
      shell: bash
      env:
        ARTIFACT_PAGES_INPUT_CHECKOUT: ${{ inputs.checkout }}
        ARTIFACT_PAGES_INPUT_FETCH_DEPTH: ${{ inputs.fetch-depth }}
      run: node "$GITHUB_ACTION_PATH/../shared/checkout-mode.mjs"
    - name: Check out the repository
      if: ${{ steps.checkout-mode.outputs.checkout == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: false
    - name: Install the bootstrap CLI
      id: install
      shell: bash
      env:
        ARTIFACT_PAGES_ACTION_KIND: publish
        ARTIFACT_PAGES_INPUT_CLI_VERSION: ${{ inputs.cli-version }}
        ARTIFACT_PAGES_INPUT_SUMMARY: ${{ inputs.summary }}
        ARTIFACT_PAGES_DOWNLOAD_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/../shared/prebuilt-cli.mjs" --action-root "$GITHUB_ACTION_PATH"
    - name: Sync the site
      id: cli
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ARTIFACT_PAGES_CLI: ${{ runner.temp }}/artifact-pages
        ARTIFACT_PAGES_ACTION_KIND: publish
        ARTIFACT_PAGES_INPUT_CLI_VERSION: ${{ inputs.cli-version }}
        ARTIFACT_PAGES_DOWNLOAD_TOKEN: ${{ github.token }}
        ARTIFACT_PAGES_INPUT_SITE: ${{ inputs.site }}
        ARTIFACT_PAGES_INPUT_SOURCE: ${{ inputs.source }}
        ARTIFACT_PAGES_INPUT_REF: ${{ inputs.ref }}
        ARTIFACT_PAGES_INPUT_CONFIG: ${{ inputs.config }}
        ARTIFACT_PAGES_INPUT_DRY_RUN: ${{ inputs.dry-run }}
        ARTIFACT_PAGES_INPUT_SUMMARY: ${{ inputs.summary }}
        ARTIFACT_PAGES_INPUT_PUBLISH_ON: ${{ inputs.publish-on }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        # Used only by the CLI to deepen a shallow checkout from this repository; never the github-token input, which may be scoped to a separate config repository.
        ARTIFACT_PAGES_FETCH_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/../shared/invoke-cli.mjs"
