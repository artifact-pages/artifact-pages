name: Artifact Pages preview publish
description: Optional thin wrapper for one site's pre-merge preview. Verifies the head repository and any explicit PR before CLI or provider access. Gate PR jobs as same-repository only and configure provider credentials in a step before this Action.
inputs:
  site:
    description: Explicit registered site ID; never inferred from repository identity.
    required: true
  source:
    description: Source directory inside the checked-out Git repository. When empty, the site's registered source path is used; an explicit value must still match it exactly.
    required: false
    default: ""
  head:
    description: Git ref whose committed tree forms the preview. When empty, a pull_request event uses its recorded head SHA; any other event uses HEAD. Never infers PR provenance.
    required: false
    default: ""
  default-ref:
    description: Default-branch ref used for merge-base selection. When empty, a pull_request event uses origin/<base ref>; any other event uses origin/HEAD. The checkout must have fetched it (fetch-depth 0).
    required: false
    default: ""
  pull-request:
    description: Positive PR number or canonical GitHub pull URL. When empty, a pull_request event supplies its own PR number (verified like an explicit one); any other event is a manual preview. Use none to force a manual preview.
    required: false
    default: ""
  include:
    description: Newline-separated source-relative paths or path.Match patterns for extra non-document resources.
    required: false
    default: ""
  base-url:
    description: Public application origin used to build review URLs. When empty, the deployment config's publicBaseURL is used (Cloudflare's cloudflare.publicBaseURL or the provider-neutral top-level publicBaseURL); the run fails if neither is available.
    required: false
    default: ""
  config:
    description: Optional deployment config path or github:// config locator.
    required: false
    default: ""
  github-token:
    description: Optional token with pull-requests:read for explicit PR verification and read-only private config access.
    required: false
    default: ""
  dry-run:
    description: Calculate changes without provider writes, lock acquisition, deletes, or cache changes.
    required: false
    default: "false"
  comment:
    description: When true and a pull request is resolved, create or update one PR comment per site with the preview links. Works on pull_request events without an explicit pull-request. Needs pull-requests:write. Comment problems never fail the publish.
    required: false
    default: "false"
  summary:
    description: When true (the default), append an operation summary to the GitHub Job Summary, also on failure. The Markdown format is a documented contract.
    required: false
    default: "true"
  checkout:
    description: "auto (default): run actions/checkout when the workspace is not already a Git checkout. true: always check out. false: never. On a pull_request event it checks out the base ref, never the pull-request head. Uses the workflow token with persist-credentials: false, never the github-token input."
    required: false
    default: auto
  fetch-depth:
    description: fetch-depth for the Action's own checkout. 0 (the default) fetches full history, which per-document updatedAt and last committer need and preview merge-base selection. Ignored when no checkout runs.
    required: false
    default: "0"
outputs:
  operation:
    description: CLI operation name.
    value: ${{ steps.cli.outputs.operation || steps.preflight.outputs.operation }}
  outcome:
    description: CLI outcome string, such as planned, published, no-op, no-preview, or failed.
    value: ${{ steps.cli.outputs.outcome || steps.preflight.outputs.outcome }}
  site:
    description: Explicit site ID selected for this operation.
    value: ${{ steps.cli.outputs.site || steps.preflight.outputs.site }}
  group-list-url:
    description: Mutable site preview-list URL filtered to the published group.
    value: ${{ steps.cli.outputs['group-list-url'] || steps.preflight.outputs['group-list-url'] }}
  documents:
    description: JSON string containing source-relative document paths, titles, and fixed revision URLs.
    value: ${{ steps.cli.outputs.documents || steps.preflight.outputs.documents }}
  result:
    description: Complete typed CLI result or trust-preflight failure envelope.
    value: ${{ steps.cli.outputs.result || steps.preflight.outputs.result }}
  exit-code:
    description: CLI or trust-preflight exit code as an integer string.
    value: ${{ steps.cli.outputs['exit-code'] || steps.preflight.outputs['exit-code'] }}
  error:
    description: CLI error text when the operation failed.
    value: ${{ steps.cli.outputs.error || steps.preflight.outputs.error }}
  comment-url:
    description: URL of the PR comment written by this run; empty when no comment was written.
    value: ${{ steps.comment.outputs['comment-url'] }}
runs:
  using: composite
  steps:
    - name: Decide whether to check out the repository
      id: checkout-mode
      shell: bash
      env:
        ARTIFACT_PAGES_INPUT_CHECKOUT: ${{ inputs.checkout }}
        ARTIFACT_PAGES_INPUT_FETCH_DEPTH: ${{ inputs.fetch-depth }}
      run: node "$GITHUB_ACTION_PATH/../shared/checkout-mode.mjs"
    - name: Check out the repository
      if: ${{ steps.checkout-mode.outputs.checkout == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.base.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: false
    - name: Verify preview pull-request trust before CLI or provider access
      id: preflight
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ARTIFACT_PAGES_INPUT_SITE: ${{ inputs.site }}
        ARTIFACT_PAGES_INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
        ARTIFACT_PAGES_INPUT_HEAD: ${{ inputs.head }}
        ARTIFACT_PAGES_INPUT_DEFAULT_REF: ${{ inputs.default-ref }}
        ARTIFACT_PAGES_INPUT_SUMMARY: ${{ inputs.summary }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: node "$GITHUB_ACTION_PATH/../shared/verify-preview-pr.mjs"
    - name: Set up Go from the pinned component source
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/../../go.mod
        cache: false
      # setup-go exports GOTOOLCHAIN=local, which makes a later setup-go in the
      # same job ignore go.mod's toolchain line; auto lets each Action honor it.
      env:
        GOTOOLCHAIN: auto
    - name: Restore the Go build cache
      id: go-cache
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      # setup-go's own cache cannot hash this go.sum: it lives outside the adopter's
      # workspace and setup-go ignores such files. Key on the pinned source instead.
      run: |
        {
          echo "paths<<ARTIFACT_PAGES_EOF"
          go env GOMODCACHE GOCACHE
          echo "ARTIFACT_PAGES_EOF"
          source_hash="$( (cat go.mod go.sum; go env GOVERSION) | (sha256sum 2>/dev/null || shasum -a 256) | cut -d' ' -f1 )"
          echo "key=artifact-pages-go-$RUNNER_OS-$RUNNER_ARCH-$source_hash"
        } >> "$GITHUB_OUTPUT"
    - name: Cache Go modules and build output
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-cache.outputs.paths }}
        key: ${{ steps.go-cache.outputs.key }}
    - name: Build the shared artifact-pages CLI
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: go build -trimpath -o "$RUNNER_TEMP/artifact-pages" ./cli/cmd/artifact-pages
    - name: Run the preview CLI operation
      id: cli
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ARTIFACT_PAGES_CLI: ${{ runner.temp }}/artifact-pages
        ARTIFACT_PAGES_ACTION_KIND: preview
        ARTIFACT_PAGES_INPUT_OPERATION: publish
        ARTIFACT_PAGES_INPUT_SITE: ${{ inputs.site }}
        ARTIFACT_PAGES_INPUT_SOURCE: ${{ inputs.source }}
        ARTIFACT_PAGES_INPUT_HEAD: ${{ inputs.head }}
        ARTIFACT_PAGES_INPUT_DEFAULT_REF: ${{ inputs.default-ref }}
        ARTIFACT_PAGES_INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
        ARTIFACT_PAGES_INPUT_INCLUDE: ${{ inputs.include }}
        ARTIFACT_PAGES_INPUT_BASE_URL: ${{ inputs.base-url }}
        ARTIFACT_PAGES_INPUT_CONFIG: ${{ inputs.config }}
        ARTIFACT_PAGES_INPUT_DRY_RUN: ${{ inputs.dry-run }}
        ARTIFACT_PAGES_INPUT_SUMMARY: ${{ inputs.summary }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: node "$GITHUB_ACTION_PATH/../shared/invoke-cli.mjs"
    - name: Create or update the preview pull-request comment
      id: comment
      if: ${{ always() && inputs.comment == 'true' && steps.preflight.outputs.trusted == 'true' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ARTIFACT_PAGES_INPUT_COMMENT: ${{ inputs.comment }}
        ARTIFACT_PAGES_INPUT_SITE: ${{ inputs.site }}
        ARTIFACT_PAGES_INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
        ARTIFACT_PAGES_COMMENT_RESULT: ${{ steps.cli.outputs.result || steps.preflight.outputs.result }}
        ARTIFACT_PAGES_COMMENT_EXIT_CODE: ${{ steps.cli.outputs['exit-code'] || steps.preflight.outputs['exit-code'] }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: node "$GITHUB_ACTION_PATH/../shared/preview-comment.mjs"
