map $uri $artifact_csp {
  default "";
  ~^/_artifacts/(?<artifact_site_id>[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)/ "default-src $scheme://$http_host/_artifacts/$artifact_site_id/ https: data: blob:; script-src $scheme://$http_host/_artifacts/$artifact_site_id/ https: 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: blob:; style-src $scheme://$http_host/_artifacts/$artifact_site_id/ https: 'unsafe-inline' data: blob:";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 ipv6=off valid=10s;

  location = /health { return 204; }
  location = /_control { return 404; }
  location ^~ /_control/ { return 404; }
  location = /_indexes/ { return 404; }
  location = /_previews { add_header Cache-Control "no-store" always; return 404; }
  location = /_previews/ { add_header Cache-Control "no-store" always; return 404; }

  location ^~ /_indexes/ {
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate" always;
    proxy_pass http://fake-gcs:4443/download/storage/v1/b/artifact-pages/o$request_uri;
  }
  location ^~ /_artifacts/ {
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=0, s-maxage=300, must-revalidate" always;
    add_header Content-Security-Policy $artifact_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass http://fake-gcs:4443/download/storage/v1/b/artifact-pages/o$request_uri;
  }
  location ^~ /_previews/ {
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Vary;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' data:; font-src 'self' data:; media-src 'self' data: blob:; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass http://fake-gcs:4443/download/storage/v1/b/artifact-pages/o$request_uri;
  }
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location = /index.html { add_header Cache-Control "no-store" always; }
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 80;
  server_name preview.localhost;
  resolver 127.0.0.11 ipv6=off valid=10s;

  location = /_preview-bridge.js {
    alias /usr/share/nginx/html/preview-bridge.js;
    default_type application/javascript;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
  }

  location ^~ /_previews/ {
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Vary;
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; sandbox allow-scripts allow-same-origin; frame-ancestors http://localhost:* http://127.0.0.1:* http://[::1]:*" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</body>' '<script src="/_preview-bridge.js" defer></script></body>';
    proxy_pass http://fake-gcs:4443/download/storage/v1/b/artifact-pages/o$request_uri;
  }

  location / { return 404; }
}
