map $uri $artifact_csp {
  default "";
  ~^/_artifacts/(?<artifact_site_id>[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)/ "default-src $scheme://$http_host/_artifacts/$artifact_site_id/ https: data: blob:; script-src $scheme://$http_host/_artifacts/$artifact_site_id/ https: 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: blob:; style-src $scheme://$http_host/_artifacts/$artifact_site_id/ https: 'unsafe-inline' data: blob:";
}

map $uri $app_asset_cache {
  default "no-cache, max-age=0, must-revalidate";
  "~^/assets/.+-[A-Za-z0-9_-]{8}[.][^/]+$" "public, max-age=31536000, immutable";
}

map $uri $preview_html_csp {
  default "default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' data:; font-src 'self' data:; media-src 'self' data: blob:; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'";
  "~^/_previews/(?<preview_policy_site>[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)/revisions/(?<preview_policy_revision>[0-9a-f]{40,64})/files/" "default-src $scheme://$http_host/_previews/$preview_policy_site/revisions/$preview_policy_revision/files/ https: data: blob:; script-src $scheme://$http_host/_previews/$preview_policy_site/revisions/$preview_policy_revision/files/ $scheme://$http_host/preview-bridge.js https: 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: blob:; style-src $scheme://$http_host/_previews/$preview_policy_site/revisions/$preview_policy_revision/files/ https: 'unsafe-inline' data: blob:";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 ipv6=off valid=10s;

  location = /health { return 204; }
  location = /_control { return 404; }
  location ^~ /_control/ { return 404; }
  location = /_indexes/ { return 404; }
  location = /_previews { add_header Cache-Control "no-store" always; return 404; }
  location = /_previews/ { add_header Cache-Control "no-store" always; return 404; }

  location ^~ /_indexes/ {
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=0, s-maxage=60, must-revalidate" always;
    proxy_pass http://minio:9000/artifact-pages$request_uri;
  }
  location ^~ /_artifacts/ {
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=0, s-maxage=300, must-revalidate" always;
    add_header Content-Security-Policy $artifact_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass http://minio:9000/artifact-pages$request_uri;
  }
  location ~* ^/_previews/(?<preview_html_path>.+\.(html|htm))$ {
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Vary;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy $preview_html_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass http://minio:9000/artifact-pages$request_uri;
  }
  location /_previews/ {
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Vary;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' data:; font-src 'self' data:; media-src 'self' data: blob:; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass http://minio:9000/artifact-pages$request_uri;
  }
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control $app_asset_cache always;
  }
  location = /index.html { add_header Cache-Control "no-cache, max-age=0, must-revalidate" always; }
  location = /preview-bridge.js { add_header Cache-Control "no-cache, max-age=0, must-revalidate" always; }
  location = /LICENSE { add_header Cache-Control "no-cache, max-age=0, must-revalidate" always; }
  location = /THIRD_PARTY_NOTICES.txt { add_header Cache-Control "no-cache, max-age=0, must-revalidate" always; }
  location / {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
