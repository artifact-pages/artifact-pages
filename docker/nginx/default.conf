map $uri $artifact_csp {
  default "";
  ~^/_artifacts/(?<artifact_site_id>[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)/ "default-src $scheme://$http_host/_artifacts/$artifact_site_id/ https: data: blob:; script-src $scheme://$http_host/_artifacts/$artifact_site_id/ https: 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: blob:; style-src $scheme://$http_host/_artifacts/$artifact_site_id/ https: 'unsafe-inline' data: blob:";
}

map $uri $preview_csp {
  default "default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' data:; font-src 'self' data:; media-src 'self' data: blob:; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /_control {
    return 404;
  }

  location ^~ /_control/ {
    return 404;
  }

  location ^~ /_indexes/ {
    alias /usr/share/nginx/storage/_indexes/;
    autoindex on;
    autoindex_exact_size off;
    add_header Cache-Control "no-store";
  }

  location ^~ /_artifacts/ {
    alias /usr/share/nginx/storage/_artifacts/;
    add_header Content-Security-Policy $artifact_csp always;
  }

  location = /_previews {
    add_header Content-Security-Policy $preview_csp always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404;
  }

  location = /_previews/ {
    add_header Content-Security-Policy $preview_csp always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404;
  }

  location ~* ^/_previews/(?<preview_markdown_path>.+\.(md|markdown))$ {
    alias /usr/share/nginx/previews/$preview_markdown_path;
    default_type text/markdown;
    add_header Content-Security-Policy $preview_csp always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /_previews/ {
    alias /usr/share/nginx/previews/;
    add_header Content-Security-Policy $preview_csp always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Preview HTML runs on a separate local origin. The iframe can therefore keep
# same-origin access to its own static resources without becoming same-origin
# with the application, and no opaque-origin CORS exception is needed.
server {
  listen 80;
  server_name preview.localhost;

  location = /_preview-bridge.js {
    alias /usr/share/nginx/html/preview-bridge.js;
    default_type application/javascript;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
  }

  location ^~ /_previews/ {
    alias /usr/share/nginx/previews/;
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; sandbox allow-scripts allow-same-origin; frame-ancestors http://localhost:* http://127.0.0.1:* http://[::1]:*" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</body>' '<script src="/_preview-bridge.js" defer></script></body>';
  }

  location / {
    return 404;
  }
}
