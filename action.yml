# Marketplace entry point (TD4): the same contract as actions/site-publish, resolved from the repository root.
name: Artifact Pages
description: Publish a registered site to Artifact Pages, a searchable static reader for Git-managed documents.
author: tasuku43
branding:
  icon: book-open
  color: blue
inputs:
  site:
    description: Explicit registered site ID; never inferred from repository identity.
    required: true
  source:
    description: Publishable source directory inside the checked-out Git repository.
    required: false
    default: ""
  config:
    description: Optional deployment config path or github:// config locator.
    required: false
    default: ""
  github-token:
    description: Optional token with read-only access to a separate private admin config repository; otherwise uses this workflow's GITHUB_TOKEN.
    required: false
    default: ""
  dry-run:
    description: Calculate and report the origin changes without writes.
    required: false
    default: "false"
  publish-on:
    description: "Optional newline-separated list of `event` or `event:ref` entries (for example `push:refs/heads/main`, `workflow_dispatch`). A run that matches none of them becomes a dry-run. An explicit `dry-run: true` always wins; empty means no condition."
    required: false
    default: ""
  summary:
    description: When true (the default), append an operation summary to the GitHub Job Summary, also on failure. The Markdown format is a documented contract.
    required: false
    default: "true"
  checkout:
    description: "auto (default): run actions/checkout when the workspace is not already a Git checkout. true: always check out. false: never.  Uses the workflow token with persist-credentials: false, never the github-token input."
    required: false
    default: auto
  fetch-depth:
    description: fetch-depth for the Action's own checkout. 0 (the default) fetches full history, which per-document updatedAt and last committer need. Ignored when no checkout runs.
    required: false
    default: "0"
outputs:
  operation:
    description: CLI operation name.
    value: ${{ steps.cli.outputs.operation }}
  outcome:
    description: CLI outcome string, such as planned, published, no-op, or failed.
    value: ${{ steps.cli.outputs.outcome }}
  site:
    description: Explicit site ID selected for this operation.
    value: ${{ steps.cli.outputs.site }}
  registry-updated:
    description: JSON boolean rendered as true or false when present.
    value: ${{ steps.cli.outputs['registry-updated'] }}
  changes:
    description: JSON array of per-path production changes.
    value: ${{ steps.cli.outputs.changes }}
  preview-changes:
    description: JSON array of preview catalog dispositions.
    value: ${{ steps.cli.outputs['preview-changes'] }}
  result:
    description: Complete CLI JSON result object.
    value: ${{ steps.cli.outputs.result }}
  exit-code:
    description: Original artifact-pages CLI exit code as an integer string.
    value: ${{ steps.cli.outputs['exit-code'] }}
  error:
    description: CLI error text when the operation failed.
    value: ${{ steps.cli.outputs.error }}
runs:
  using: composite
  steps:
    - name: Decide whether to check out the repository
      id: checkout-mode
      shell: bash
      env:
        ARTIFACT_PAGES_INPUT_CHECKOUT: ${{ inputs.checkout }}
        ARTIFACT_PAGES_INPUT_FETCH_DEPTH: ${{ inputs.fetch-depth }}
      run: node "$GITHUB_ACTION_PATH/actions/shared/checkout-mode.mjs"
    - name: Check out the repository
      if: ${{ steps.checkout-mode.outputs.checkout == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: false
    - name: Install the released CLI when the Action ref is a release tag
      id: prebuilt
      shell: bash
      env:
        ARTIFACT_PAGES_ACTION_REF: ${{ github.action_ref }}
        ARTIFACT_PAGES_ACTION_REPOSITORY: ${{ github.action_repository }}
        ARTIFACT_PAGES_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/actions/shared/prebuilt-cli.mjs" --source-root "${{ github.action_path }}"
    - name: Set up Go from the pinned component source
      if: ${{ steps.prebuilt.outputs.used != 'true' }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false
      # setup-go exports GOTOOLCHAIN=local, which makes a later setup-go in the
      # same job ignore go.mod's toolchain line; auto lets each Action honor it.
      env:
        GOTOOLCHAIN: auto
    - name: Restore the Go build cache
      if: ${{ steps.prebuilt.outputs.used != 'true' }}
      id: go-cache
      shell: bash
      working-directory: ${{ github.action_path }}
      # setup-go's own cache cannot hash this go.sum: it lives outside the adopter's
      # workspace and setup-go ignores such files. Key on the pinned source instead.
      run: |
        {
          echo "paths<<ARTIFACT_PAGES_EOF"
          go env GOMODCACHE GOCACHE
          echo "ARTIFACT_PAGES_EOF"
          source_hash="$( (cat go.mod go.sum; go env GOVERSION) | (sha256sum 2>/dev/null || shasum -a 256) | cut -d' ' -f1 )"
          echo "key=artifact-pages-go-$RUNNER_OS-$RUNNER_ARCH-$source_hash"
        } >> "$GITHUB_OUTPUT"
    - name: Cache Go modules and build output
      if: ${{ steps.prebuilt.outputs.used != 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-cache.outputs.paths }}
        key: ${{ steps.go-cache.outputs.key }}
    - name: Build the shared artifact-pages CLI
      if: ${{ steps.prebuilt.outputs.used != 'true' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -trimpath -o "$RUNNER_TEMP/artifact-pages" ./cli/cmd/artifact-pages
    - name: Run the explicit-site CLI operation
      id: cli
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ARTIFACT_PAGES_CLI: ${{ runner.temp }}/artifact-pages
        ARTIFACT_PAGES_ACTION_KIND: site
        ARTIFACT_PAGES_INPUT_OPERATION: publish
        ARTIFACT_PAGES_INPUT_SITE: ${{ inputs.site }}
        ARTIFACT_PAGES_INPUT_SOURCE: ${{ inputs.source }}
        ARTIFACT_PAGES_INPUT_CONFIG: ${{ inputs.config }}
        ARTIFACT_PAGES_INPUT_DRY_RUN: ${{ inputs.dry-run }}
        ARTIFACT_PAGES_INPUT_SUMMARY: ${{ inputs.summary }}
        ARTIFACT_PAGES_INPUT_PUBLISH_ON: ${{ inputs.publish-on }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: node "$GITHUB_ACTION_PATH/actions/shared/invoke-cli.mjs"
