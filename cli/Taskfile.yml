version: '3'

vars:
  REPO_ROOT: '{{.TASKFILE_DIR}}/..'
  DRY_RUN: '{{.DRY_RUN | default "false"}}'

tasks:
  build:
    desc: Build the CLI at ./artifact-pages
    dir: '{{.REPO_ROOT}}'
    cmds:
      - go build -o artifact-pages ./cli/cmd/artifact-pages

  test:
    desc: Run all CLI Go tests
    dir: '{{.REPO_ROOT}}'
    cmds:
      - go test ./cli/... -count=1

  site:sync: &site_sync
    desc: Reconcile one explicitly selected site from its Git working tree (SITE, SOURCE, optional CONFIG, DRY_RUN)
    dir: '{{.REPO_ROOT}}'
    vars:
      CONFIG_FLAGS: >-
        {{if .CONFIG}}--config {{.CONFIG | shellQuote}}{{end}}
    requires:
      vars:
        - SITE
        - SOURCE
        - name: DRY_RUN
          enum: ['true', 'false']
    cmds:
      - task: build
      - >-
        ./artifact-pages site sync --site {{.SITE | shellQuote}} --source {{.SOURCE | shellQuote}}
        {{.CONFIG_FLAGS}} {{if eq .DRY_RUN "true"}}--dry-run{{end}}

  site:sync:cloudflare:
    <<: *site_sync
    desc: Reconcile a Cloudflare site with the base config and overlay (SITE, SOURCE, DRY_RUN)
    vars:
      CONFIG_FLAGS: --config artifact-pages.yaml --config artifact-pages.cloudflare.yaml

  registry:sync: &registry_sync
    desc: Reconcile the configured site registry (optional CONFIG, DRY_RUN)
    dir: '{{.REPO_ROOT}}'
    vars:
      CONFIG_FLAGS: '{{if .CONFIG}}--config {{.CONFIG | shellQuote}}{{end}}'
    requires:
      vars:
        - name: DRY_RUN
          enum: ['true', 'false']
    cmds:
      - task: build
      - ./artifact-pages registry sync {{.CONFIG_FLAGS}} {{if eq .DRY_RUN "true"}}--dry-run{{end}}

  registry:sync:cloudflare:
    <<: *registry_sync
    desc: Reconcile the Cloudflare registry with the base config and overlay (DRY_RUN)
    vars:
      CONFIG_FLAGS: --config artifact-pages.yaml --config artifact-pages.cloudflare.yaml

  app:deploy: &deploy
    desc: Deploy the app bundle pinned by this CLI, or a local ARCHIVE (optional CONFIG, DRY_RUN)
    dir: '{{.REPO_ROOT}}'
    vars:
      CONFIG_FLAGS: '{{if .CONFIG}}--config {{.CONFIG | shellQuote}}{{end}}'
    requires:
      vars:
        - name: DRY_RUN
          enum: ['true', 'false']
    cmds:
      - task: build
      - >-
        ./artifact-pages app deploy
        {{if .ARCHIVE}}--archive {{.ARCHIVE | shellQuote}}{{end}}
        {{.CONFIG_FLAGS}} {{if eq .DRY_RUN "true"}}--dry-run{{end}}

  app:deploy:cloudflare:
    <<: *deploy
    desc: Deploy the app to Cloudflare with the base config and overlay (optional ARCHIVE, DRY_RUN)
    vars:
      CONFIG_FLAGS: --config artifact-pages.yaml --config artifact-pages.cloudflare.yaml

  app:remove: &app_remove
    desc: Remove only application-plane objects (optional CONFIG, DRY_RUN)
    dir: '{{.REPO_ROOT}}'
    vars:
      CONFIG_FLAGS: '{{if .CONFIG}}--config {{.CONFIG | shellQuote}}{{end}}'
    requires:
      vars:
        - name: DRY_RUN
          enum: ['true', 'false']
    cmds:
      - task: build
      - ./artifact-pages app remove {{.CONFIG_FLAGS}} {{if eq .DRY_RUN "true"}}--dry-run{{end}}

  app:remove:cloudflare:
    <<: *app_remove
    desc: Remove Cloudflare application-plane objects (DRY_RUN)
    vars:
      CONFIG_FLAGS: --config artifact-pages.yaml --config artifact-pages.cloudflare.yaml

  preview:publish: &preview
    desc: Publish a review preview (SITE, SOURCE, BASE_URL, optional HEAD, DEFAULT_REF, PULL_REQUEST, CONFIG, DRY_RUN)
    dir: '{{.REPO_ROOT}}'
    vars:
      CONFIG_FLAGS: '{{if .CONFIG}}--config {{.CONFIG | shellQuote}}{{end}}'
    requires:
      vars:
        - SITE
        - SOURCE
        - BASE_URL
        - name: DRY_RUN
          enum: ['true', 'false']
    cmds:
      - task: build
      - >-
        ./artifact-pages preview publish --site {{.SITE | shellQuote}} --source {{.SOURCE | shellQuote}}
        --base-url {{.BASE_URL | shellQuote}}
        {{if .HEAD}}--head {{.HEAD | shellQuote}}{{end}}
        {{if .DEFAULT_REF}}--default-ref {{.DEFAULT_REF | shellQuote}}{{end}}
        {{if .PULL_REQUEST}}--pull-request {{.PULL_REQUEST | shellQuote}}{{end}}
        {{if .INCLUDE}}--include {{.INCLUDE | shellQuote}}{{end}}
        {{.CONFIG_FLAGS}} {{if eq .DRY_RUN "true"}}--dry-run{{end}}

  preview:publish:cloudflare:
    <<: *preview
    desc: Publish a Cloudflare preview (SITE, SOURCE, BASE_URL, optional PULL_REQUEST, DRY_RUN)
    vars:
      CONFIG_FLAGS: --config artifact-pages.yaml --config artifact-pages.cloudflare.yaml

  preview:remove: &preview_remove
    desc: Remove all revisions for one preview group (SITE, GROUP, optional CONFIG, DRY_RUN)
    dir: '{{.REPO_ROOT}}'
    vars:
      CONFIG_FLAGS: '{{if .CONFIG}}--config {{.CONFIG | shellQuote}}{{end}}'
    requires:
      vars:
        - SITE
        - GROUP
        - name: DRY_RUN
          enum: ['true', 'false']
    cmds:
      - task: build
      - ./artifact-pages preview remove --site {{.SITE | shellQuote}} --group {{.GROUP | shellQuote}} {{.CONFIG_FLAGS}} {{if eq .DRY_RUN "true"}}--dry-run{{end}}

  preview:remove:cloudflare:
    <<: *preview_remove
    desc: Remove a Cloudflare preview group (SITE, GROUP, DRY_RUN)
    vars:
      CONFIG_FLAGS: --config artifact-pages.yaml --config artifact-pages.cloudflare.yaml

  index:build:
    desc: Build only a local site index (SITE, SOURCE, OUT, optional TITLE, REF, REPOSITORY, REPOSITORY_URL)
    dir: '{{.REPO_ROOT}}'
    requires:
      vars:
        - SITE
        - SOURCE
        - OUT
        - name: DRY_RUN
          enum: ['false']
    cmds:
      - task: build
      - >-
        ./artifact-pages index build --site {{.SITE | shellQuote}} --source {{.SOURCE | shellQuote}} --out {{.OUT | shellQuote}}
        {{if .TITLE}}--site-title {{.TITLE | shellQuote}}{{end}}
        {{if .REF}}--ref {{.REF | shellQuote}}{{end}}
        {{if .REPOSITORY}}--repository {{.REPOSITORY | shellQuote}}{{end}}
        {{if .REPOSITORY_URL}}--repository-url {{.REPOSITORY_URL | shellQuote}}{{end}}

  config:set-default:
    desc: Save the user's default config locator (LOCATOR)
    dir: '{{.REPO_ROOT}}'
    requires:
      vars:
        - LOCATOR
        - name: DRY_RUN
          enum: ['false']
    cmds:
      - task: build
      - ./artifact-pages config set-default {{.LOCATOR | shellQuote}}

  lock:inspect: &inspect
    desc: Inspect a site, registry, or application lock (SITE or SCOPE=registry|application, optional CONFIG)
    dir: '{{.REPO_ROOT}}'
    vars:
      CONFIG_FLAGS: '{{if .CONFIG}}--config {{.CONFIG | shellQuote}}{{end}}'
      SCOPE: '{{.SCOPE | default "site"}}'
    requires:
      vars:
        - name: SCOPE
          enum: ['site', 'registry', 'application']
    preconditions:
      - sh: '{{if eq .SCOPE "site"}}{{if .SITE}}true{{else}}false{{end}}{{else}}{{if .SITE}}false{{else}}true{{end}}{{end}}'
        msg: Specify SITE for SCOPE=site, or use registry/application without SITE.
    cmds:
      - task: build
      - ./artifact-pages lock inspect --scope {{.SCOPE | shellQuote}} {{if .SITE}}--site {{.SITE | shellQuote}}{{end}} {{.CONFIG_FLAGS}}

  lock:inspect:cloudflare:
    <<: *inspect
    desc: Inspect a Cloudflare site, registry, or application lock
    vars:
      CONFIG_FLAGS: --config artifact-pages.yaml --config artifact-pages.cloudflare.yaml
      SCOPE: '{{.SCOPE | default "site"}}'

  lock:recover: &recover
    <<: *inspect
    desc: Recover a confirmed stale lock (SITE or SCOPE=registry|application, OBSERVED_ETAG, optional CONFIG; no dry-run)
    requires:
      vars:
        - OBSERVED_ETAG
        - name: SCOPE
          enum: ['site', 'registry', 'application']
        - name: DRY_RUN
          enum: ['false']
    cmds:
      - task: build
      - ./artifact-pages lock recover --scope {{.SCOPE | shellQuote}} {{if .SITE}}--site {{.SITE | shellQuote}}{{end}} --observed-etag {{.OBSERVED_ETAG | shellQuote}} {{.CONFIG_FLAGS}}

  lock:recover:cloudflare:
    <<: *recover
    desc: Recover a confirmed stale Cloudflare lock (SITE or SCOPE=registry|application, OBSERVED_ETAG; no dry-run)
    vars:
      CONFIG_FLAGS: --config artifact-pages.yaml --config artifact-pages.cloudflare.yaml
      SCOPE: '{{.SCOPE | default "site"}}'
