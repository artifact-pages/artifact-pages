version: '3'

vars:
  REPO_ROOT: '{{.TASKFILE_DIR}}/..'
  DRY_RUN: '{{.DRY_RUN | default "false"}}'

tasks:
  build:
    desc: Build the CLI at ./artifact-pages
    dir: '{{.REPO_ROOT}}'
    cmds:
      - go build -o artifact-pages ./cli/cmd/artifact-pages

  test:
    desc: Run all CLI Go tests
    dir: '{{.REPO_ROOT}}'
    cmds:
      - go test ./cli/... -count=1

  publish: &publish
    desc: Publish one explicitly selected site and source (SITE, SOURCE, optional CONFIG, DRY_RUN)
    dir: '{{.REPO_ROOT}}'
    vars:
      CONFIG_FLAGS: >-
        {{if .CONFIG}}--config {{.CONFIG | shellQuote}}{{end}}
    requires:
      vars:
        - SITE
        - SOURCE
        - name: DRY_RUN
          enum: ['true', 'false']
    cmds:
      - task: build
      - >-
        ./artifact-pages site publish --site {{.SITE | shellQuote}} --source {{.SOURCE | shellQuote}}
        {{.CONFIG_FLAGS}} {{if eq .DRY_RUN "true"}}--dry-run{{end}}

  publish:cloudflare:
    <<: *publish
    desc: Publish to Cloudflare with the base config and Cloudflare overlay (SITE, SOURCE, DRY_RUN)
    vars:
      CONFIG_FLAGS: --config artifact-pages.yaml --config artifact-pages.cloudflare.yaml

  registry: &registry
    desc: Reconcile the configured site registry (optional CONFIG, DRY_RUN)
    dir: '{{.REPO_ROOT}}'
    vars:
      CONFIG_FLAGS: '{{if .CONFIG}}--config {{.CONFIG | shellQuote}}{{end}}'
    requires:
      vars:
        - name: DRY_RUN
          enum: ['true', 'false']
    cmds:
      - task: build
      - ./artifact-pages registry register {{.CONFIG_FLAGS}} {{if eq .DRY_RUN "true"}}--dry-run{{end}}

  registry:cloudflare:
    <<: *registry
    desc: Reconcile the Cloudflare registry with the base config and overlay (DRY_RUN)
    vars:
      CONFIG_FLAGS: --config artifact-pages.yaml --config artifact-pages.cloudflare.yaml

  deploy: &deploy
    desc: Deploy an app bundle (exactly one ARCHIVE or VERSION, optional CONFIG, DRY_RUN)
    dir: '{{.REPO_ROOT}}'
    vars:
      CONFIG_FLAGS: '{{if .CONFIG}}--config {{.CONFIG | shellQuote}}{{end}}'
    requires:
      vars:
        - name: DRY_RUN
          enum: ['true', 'false']
    preconditions:
      - sh: '{{if and .ARCHIVE .VERSION}}false{{else if or .ARCHIVE .VERSION}}true{{else}}false{{end}}'
        msg: Specify exactly one of ARCHIVE or VERSION.
    cmds:
      - task: build
      - >-
        ./artifact-pages app deploy
        {{if .ARCHIVE}}--archive {{.ARCHIVE | shellQuote}}{{else if .VERSION}}--version {{.VERSION | shellQuote}}{{end}}
        {{.CONFIG_FLAGS}} {{if eq .DRY_RUN "true"}}--dry-run{{end}}

  deploy:cloudflare:
    <<: *deploy
    desc: Deploy the app to Cloudflare with the base config and overlay (ARCHIVE or VERSION, DRY_RUN)
    vars:
      CONFIG_FLAGS: --config artifact-pages.yaml --config artifact-pages.cloudflare.yaml
