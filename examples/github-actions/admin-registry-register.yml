name: Register Artifact Pages sites

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  register-sites:
    runs-on: ubuntu-24.04
    environment: artifact-pages-production
    steps:
      - name: Check out the admin repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assume the registry-only deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ARTIFACT_PAGES_REGISTRY_ADMIN_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: artifact-pages-admin-${{ github.run_id }}

      - name: Register the committed sites
        id: register-sites
        uses: tasuku43/git-artifact-pages/actions/admin@<FULL_REVIEWED_ACTION_COMMIT_SHA>
        with:
          operation: registry-register
          config: .artifact-pages.yaml

      - name: Use the typed CLI result
        if: always()
        env:
          OUTCOME: ${{ steps.register-sites.outputs.outcome }}
          EXIT_CODE: ${{ steps.register-sites.outputs.exit_code }}
          RESULT_JSON: ${{ steps.register-sites.outputs.result_json }}
        run: |
          printf 'Artifact Pages outcome=%s exit_code=%s\n' "$OUTCOME" "$EXIT_CODE"
          printf '%s\n' "$RESULT_JSON"
