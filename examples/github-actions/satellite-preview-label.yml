name: Publish the SRE review preview when a PR has the preview label

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    paths:
      - docs/artifacts/**

# Every `labeled` event for the PR shares one concurrency group, so adding an unrelated
# label would cancel an in-flight preview. Unrelated-label events therefore get a group
# of their own (the run ID makes it unique); the job below skips them anyway.
concurrency:
  group: artifact-pages-preview-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'preview' && format('-unrelated-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  publish-preview:
    # Fork PRs are skipped before any step runs. Later pushes publish only while the label is
    # still on the PR; a `labeled` event publishes only when the added label is `preview`.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # read for trust verification, write for the preview comment
      id-token: write
    steps:
      - name: Check out the registered repository with full history
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Provider credentials are requested below, so verify trust first.
      - name: Verify the pull request before requesting publisher credentials
        uses: tasuku43/git-artifact-pages/actions/preview-preflight@<FULL_REVIEWED_ACTION_COMMIT_SHA>
        with:
          pull-request: ${{ github.event.pull_request.number }}

      - name: Assume the SRE preview publisher role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ARTIFACT_PAGES_SRE_PREVIEW_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: artifact-pages-preview-${{ github.run_id }}

      - name: Publish the explicitly selected pull-request preview
        id: publish-preview
        uses: tasuku43/git-artifact-pages/actions/preview-publish@<FULL_REVIEWED_ACTION_COMMIT_SHA>
        with:
          site: sre
          source: docs/artifacts
          pull-request: ${{ github.event.pull_request.number }}
          base-url: ${{ vars.ARTIFACT_PAGES_BASE_URL }}
          config: github://example/platform-admin/artifact-pages.yaml?ref=<FULL_ADMIN_CONFIG_COMMIT_SHA>
          comment: true
