services:
  minio:
    profiles: [aws, cloudflare]
    build:
      context: ./docker/edge
      dockerfile: minio.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${MINIO_PORT:-19000}:9000"
    volumes:
      - "${EDGE_STATE_DIR:-.local/edge-profiles/aws}/minio:/data"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 45

  seed-s3:
    profiles: [aws, cloudflare]
    image: amazon/aws-cli:2.27.41
    entrypoint: ["/bin/sh"]
    command: ["/scripts/seed-s3.sh"]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./scripts/edge/seed-s3.sh:/scripts/seed-s3.sh:ro
      - ./scripts/edge/assert-cloudflare-unregister.sh:/scripts/assert-cloudflare-unregister.sh:ro
      - ./fixtures/storage:/seed/storage:ro
    depends_on:
      minio:
        condition: service_healthy

  cloudflare-purge-mock:
    profiles: [cloudflare]
    image: node:22.12.0-alpine
    command: ["node", "/scripts/cloudflare-purge-mock.mjs"]
    environment:
      PORT: 8787
      CF_API_TOKEN: edge-test-token
    ports:
      - "127.0.0.1:${CF_API_PORT:-18787}:8787"
    volumes:
      - ./scripts/edge/cloudflare-purge-mock.mjs:/scripts/cloudflare-purge-mock.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.status === 204 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  fake-gcs:
    profiles: [gcp]
    image: fsouza/fake-gcs-server:1.56.1
    command: ["-scheme", "http", "-backend", "filesystem", "-filesystem-root", "/data"]
    ports:
      - "127.0.0.1:${GCS_PORT:-14443}:4443"
    volumes:
      - "${EDGE_STATE_DIR:-.local/edge-profiles/gcp}/gcs:/data"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4443/storage/v1/b"]
      interval: 2s
      timeout: 2s
      retries: 45

  seed-gcs:
    profiles: [gcp]
    image: node:22.12.0-alpine
    command: ["node", "/scripts/seed-gcs.mjs", "/seed/storage"]
    environment:
      GCS_API_URL: http://fake-gcs:4443
      GCS_BUCKET: artifact-pages
    volumes:
      - ./scripts/edge/seed-gcs.mjs:/scripts/seed-gcs.mjs:ro
      - ./fixtures/storage:/seed/storage:ro
    depends_on:
      fake-gcs:
        condition: service_healthy

  edge-aws:
    profiles: [aws]
    image: nginx:1.27.5-alpine
    ports:
      - "127.0.0.1:${EDGE_PORT:-8081}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/edge/nginx/s3.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      seed-s3:
        condition: service_completed_successfully

  edge-cloudflare:
    profiles: [cloudflare]
    image: nginx:1.27.5-alpine
    ports:
      - "127.0.0.1:${EDGE_PORT:-8081}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/edge/nginx/s3.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      seed-s3:
        condition: service_completed_successfully
      cloudflare-purge-mock:
        condition: service_healthy

  edge-gcp:
    profiles: [gcp]
    image: nginx:1.27.5-alpine
    ports:
      - "127.0.0.1:${EDGE_PORT:-8081}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/edge/nginx/gcs.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      seed-gcs:
        condition: service_completed_successfully
