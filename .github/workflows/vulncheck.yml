# Weekly vulnerability scan of main. Pull requests and pushes are covered by the
# govulncheck step in verify.yml; this catches advisories published afterwards.
name: Vulnerability check

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulncheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck on main
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
