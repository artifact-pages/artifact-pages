# Reusable verification shared by ci.yml and release.yml so a release runs the
# same tests as every pull request, plus the compatibility gate.
name: Verify

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to run the gate's version check for; empty outside releases.
        required: false
        type: string
        default: ""
    outputs:
      compat_verdict:
        description: Compatibility gate verdict (compatible, breaking or skipped).
        value: ${{ jobs.compat-gate.outputs.verdict }}
      compat_report:
        description: Complete compatibility gate report as one line of JSON.
        value: ${{ jobs.compat-gate.outputs.report }}

permissions:
  contents: read

jobs:
  test:
    name: Unit, type and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Some fast Node tests (full-text core, app cache rollback) drive Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Go vet
        run: go vet ./...
      - name: Go modules are tidy
        run: |
          go mod tidy -diff
          cd scripts/gomodzip && go mod tidy -diff
      # Pinned so a new release cannot change results unreviewed; the scheduled
      # Vulnerability check workflow reports new advisories between pull requests.
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Go tests
        run: go test ./... -count=1
      # A file name Go rejects would break `go install …@vX.Y.Z` for everyone.
      - name: Go module zip check
        run: |
          module_dir="$RUNNER_TEMP/module"
          mkdir -p "$module_dir"
          git archive HEAD | tar -x -C "$module_dir"
          cd scripts/gomodzip && go run . "$module_dir"
      - name: Type check
        run: npx tsc -b web/tsconfig.json
      - name: Fast Node tests
        run: |
          npm run test:compatibility-policy
          npm run test:text-highlight
          npm run test:palette-sections
          npm run test:fulltext
          npm run test:third-party-notices
          npm run test:vite-malformed-url
          npm run test:web-packaging
          npm run test:provider-delivery
          npm run test:actions-shared
          npm run test:action-repos
          npm run test:cli-release
          npm run test:actions-parity
          npm run test:app-cache-rollback
          node scripts/test-clean-room-adoption.mjs
      - name: Browser tests (nginx behind Docker Compose)
        run: npm run test:e2e

  # Cloudflare Terraform module (IMP-63): fmt, validate, `terraform test`, contract tests, the
  # loopback lifecycle round-trip and the module-address migration fixture, all offline.
  # Terraform is pinned to the version scripts/validate.sh requires.
  terraform-cloudflare:
    name: Cloudflare Terraform module
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Module validation (fmt, validate, terraform test, contract and Node tests)
        run: terraform/modules/cloudflare/scripts/validate.sh
      - name: Deployment roots and example format and validate
        run: |
          set -euo pipefail
          terraform fmt -check -recursive terraform/deployments/cloudflare terraform/deployments/cloudflare-verify examples/cloudflare/terraform
          for dir in terraform/deployments/cloudflare terraform/deployments/cloudflare-verify examples/cloudflare/terraform; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  # Runs every composite Action through `uses:` on a GitHub-hosted runner against a
  # runner-local target (IMP-47). The parity script covers the shared wrapper logic;
  # this job covers the composite runtime: expressions, action_path resolution and the
  # output mapping. No credentials are used.
  #
  # The published Actions download the released CLI of their own version (TD14), which
  # does not exist for unreleased code. This job therefore runs the source Actions by
  # local path (`./actions/<name>`, which carries no release.json) and gives them the CLI
  # it built from the same commit through ARTIFACT_PAGES_TEST_CLI; a published Action
  # ignores that variable.
  actions-smoke:
    name: Composite Actions smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Depth 1 and no persisted credential: the Actions must deepen from origin with the
      # workflow token (IMP-58), as an adopter's default checkout would.
      - name: Check out the repository at depth 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Assert the checkout is shallow and holds no credential
        run: |
          test "$(git rev-parse --is-shallow-repository)" = true
          test "$(git rev-list --count HEAD)" = 1
          test -z "$(git config --get-regexp extraheader || true)"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the CLI that the unreleased Actions will use
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/test-cli/artifact-pages" ./cli/cmd/artifact-pages
          echo "ARTIFACT_PAGES_TEST_CLI=$RUNNER_TEMP/test-cli/artifact-pages" >> "$GITHUB_ENV"
      - name: Prepare the runner-local target
        id: prep
        env:
          SMOKE_ROOT: ${{ runner.temp }}/actions-smoke
        run: node scripts/actions-smoke-prepare.mjs

      - name: Registry register (dry-run)
        id: register-plan
        uses: ./actions/registry
        with:
          config: ${{ steps.prep.outputs.config }}
          dry-run: "true"
      - name: Assert the dry-run planned without writes
        env:
          OUTCOME: ${{ steps.register-plan.outputs.outcome }}
          STORAGE: ${{ steps.prep.outputs.storage }}
        run: |
          test "$OUTCOME" = planned
          test -z "$(find "$STORAGE" -type f)"
      - name: Registry register
        id: register
        uses: ./actions/registry
        with:
          config: ${{ steps.prep.outputs.config }}
      - name: App deploy from a packaged archive
        id: app
        uses: ./actions/app-deploy
        with:
          archive: ${{ steps.prep.outputs.archive }}
          config: ${{ steps.prep.outputs.config }}
      - name: Assert registry and app outputs
        env:
          REGISTER_EXIT: ${{ steps.register.outputs['exit-code'] }}
          REGISTRY_UPDATED: ${{ steps.register.outputs['registry-updated'] }}
          APP_EXIT: ${{ steps.app.outputs['exit-code'] }}
          STORAGE: ${{ steps.prep.outputs.storage }}
        run: |
          test "$REGISTER_EXIT" = 0
          test "$REGISTRY_UPDATED" = true
          test "$APP_EXIT" = 0
          jq -e '.sites | map(.id) | index("smoke")' "$STORAGE/_indexes/sites.json"
          test -f "$STORAGE/index.html"

      # Runs before any site publish: the first publish unshallows the checkout, and the
      # preview must start from the depth-1 checkout to prove the fetch and deepen path.
      - name: Commit a document change to preview
        run: |
          git switch -c actions-smoke-preview
          printf '<p>Preview change from run %s.</p>\n' "$GITHUB_RUN_ID" >> fixtures/actions-smoke/site/overview.html
          git -c user.name=actions-smoke -c user.email=actions-smoke@users.noreply.github.com commit -qam "Actions smoke preview change"
      - name: Preview publish
        id: preview
        uses: ./actions/preview
        with:
          site: smoke
          source: fixtures/actions-smoke/site
          # The smoke test previews its local commit, not the pull_request event head.
          head: HEAD
          # Manual preview: do not bind to the pull_request event's PR.
          pull-request: none
          default-ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          base-url: http://localhost:4179
          config: ${{ steps.prep.outputs.config }}
      - name: Assert the preview outputs
        env:
          EXIT_CODE: ${{ steps.preview.outputs['exit-code'] }}
          DOCUMENTS: ${{ steps.preview.outputs.documents }}
          GROUP_LIST_URL: ${{ steps.preview.outputs.group-list-url }}
        run: |
          test "$EXIT_CODE" = 0
          jq -e 'map(tostring) | any(test("overview"))' <<<"$DOCUMENTS"
          test -n "$GROUP_LIST_URL"
      - name: Assert the preview deepened the shallow checkout to the merge base
        env:
          DEFAULT_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: |
          # The depth-1 checkout held neither the base ref nor its history; the CLI fetched them.
          git rev-parse --verify "$DEFAULT_REF^{commit}"
          git merge-base HEAD "$DEFAULT_REF"
      - name: Preview publish with a mismatched pull request
        id: preview-rejected
        continue-on-error: true
        uses: ./actions/preview
        with:
          site: smoke
          source: fixtures/actions-smoke/site
          pull-request: "999999"
          base-url: http://localhost:4179
          config: ${{ steps.prep.outputs.config }}
      - name: Assert the mismatched preview was rejected before the CLI
        env:
          OUTCOME: ${{ steps.preview-rejected.outcome }}
          ERROR: ${{ steps.preview-rejected.outputs.error }}
        run: |
          test "$OUTCOME" = failure
          test -n "$ERROR"

      - name: Return to the checked-out commit
        run: git switch -q --detach "$GITHUB_SHA"

      - name: Snapshot storage before the site dry-run
        id: before-site-plan
        env:
          STORAGE: ${{ steps.prep.outputs.storage }}
        run: echo "digest=$(cd "$STORAGE" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Site publish (dry-run)
        id: site-plan
        uses: ./actions/publish
        with:
          site: smoke
          config: ${{ steps.prep.outputs.config }}
          dry-run: "true"
      - name: Assert the site dry-run planned without writes
        env:
          OUTCOME: ${{ steps.site-plan.outputs.outcome }}
          CHANGES: ${{ steps.site-plan.outputs.changes }}
          BEFORE: ${{ steps.before-site-plan.outputs.digest }}
          STORAGE: ${{ steps.prep.outputs.storage }}
        run: |
          test "$OUTCOME" = planned
          test "$(jq length <<<"$CHANGES")" -gt 0
          test "$BEFORE" = "$(cd "$STORAGE" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
      - name: Site publish
        id: site-fulltext
        uses: ./actions/publish
        with:
          site: smoke
          config: ${{ steps.prep.outputs.config }}
      - name: Assert the publish and its full-text data
        env:
          OUTCOME: ${{ steps.site-fulltext.outputs.outcome }}
          SITE: ${{ steps.site-fulltext.outputs.site }}
          STORAGE: ${{ steps.prep.outputs.storage }}
        run: |
          test "$OUTCOME" = published
          test "$SITE" = smoke
          jq -e '.fullTextUrl' "$STORAGE/_indexes/smoke/meta.json"
          test -f "$STORAGE/_artifacts/smoke/overview.html"
      - name: Assert Git metadata from the depth-1 checkout equals the full history
        env:
          STORAGE: ${{ steps.prep.outputs.storage }}
        run: |
          # The publish deepened the checkout; compare with what the complete history says.
          test "$(git rev-parse --is-shallow-repository)" = false
          expected="$(git log -1 --format=%ct -- fixtures/actions-smoke/site/overview.html)"
          actual="$(date -u -d "$(jq -r '.artifacts[] | select(.path == "overview.html") | .updatedAt' "$STORAGE/_indexes/smoke/index.json")" +%s)"
          test "$expected" = "$actual"
          test "$(git log -1 --format=%cn -- fixtures/actions-smoke/site/overview.html)" = "$(jq -r '.artifacts[] | select(.path == "overview.html") | .lastCommitter.name' "$STORAGE/_indexes/smoke/index.json")"
      - name: Repeat the site publish
        id: site-repeat
        uses: ./actions/publish
        with:
          site: smoke
          config: ${{ steps.prep.outputs.config }}
      - name: Assert the full-text data is still advertised
        env:
          EXIT_CODE: ${{ steps.site-repeat.outputs['exit-code'] }}
          STORAGE: ${{ steps.prep.outputs.storage }}
        run: |
          test "$EXIT_CODE" = 0
          jq -e '.fullTextUrl' "$STORAGE/_indexes/smoke/meta.json"

      - name: Site publish for an unregistered site
        id: unregistered
        continue-on-error: true
        uses: ./actions/publish
        with:
          site: not-registered
          config: ${{ steps.prep.outputs.config }}
          dry-run: "true"
      - name: Site publish with an invalid input
        id: invalid
        continue-on-error: true
        uses: ./actions/publish
        with:
          site: smoke
          config: ${{ steps.prep.outputs.config }}
          dry-run: maybe
      - name: Assert relayed failure classes
        env:
          UNREGISTERED_OUTCOME: ${{ steps.unregistered.outcome }}
          UNREGISTERED_EXIT: ${{ steps.unregistered.outputs['exit-code'] }}
          UNREGISTERED_ERROR: ${{ steps.unregistered.outputs.error }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
          INVALID_EXIT: ${{ steps.invalid.outputs['exit-code'] }}
        run: |
          test "$UNREGISTERED_OUTCOME" = failure
          test "$UNREGISTERED_EXIT" = 1
          test -n "$UNREGISTERED_ERROR"
          test "$INVALID_OUTCOME" = failure
          test "$INVALID_EXIT" = 2

      # `registry unregister` has no Action (TD14); the CLI built above runs it.
      - name: Registry unregister (CLI)
        id: unregister
        env:
          CONFIG: ${{ steps.prep.outputs.unregister-config }}
        run: |
          set -euo pipefail
          "$ARTIFACT_PAGES_TEST_CLI" registry unregister --site smoke --config "$CONFIG" --format json | tee "$RUNNER_TEMP/unregister.json"
          echo "exit-code=0" >> "$GITHUB_OUTPUT"
      - name: Assert the site was unregistered
        env:
          EXIT_CODE: ${{ steps.unregister.outputs['exit-code'] }}
          STORAGE: ${{ steps.prep.outputs.storage }}
        run: |
          test "$EXIT_CODE" = 0
          jq -e '.sites | map(.id) | index("smoke") | not' "$STORAGE/_indexes/sites.json"
          test ! -e "$STORAGE/_indexes/smoke"

  compat-gate:
    name: Compatibility gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      report: ${{ steps.gate.outputs.report }}
    steps:
      - name: Check out the repository with its release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the gate against the latest release
        id: gate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          args=(--out "$RUNNER_TEMP/compat-verdict.json")
          if [ -n "$RELEASE_TAG" ]; then args+=(--tag "$RELEASE_TAG"); fi
          status=0
          node scripts/compat-gate.mjs "${args[@]}" || status=$?
          if [ -f "$RUNNER_TEMP/compat-verdict.json" ]; then
            echo "verdict=$(jq -r .verdict "$RUNNER_TEMP/compat-verdict.json")" >> "$GITHUB_OUTPUT"
            echo "report=$(jq -c . "$RUNNER_TEMP/compat-verdict.json")" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
