# Each approved component tag publishes only its own series (TD17).
name: Release
on:
  push:
    tags: ["v*", "web/v*", "publish-action/v*", "preview-action/v*", "registry-action/v*", "app-deploy-action/v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Component tag preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      component: ${{ steps.series.outputs.component }}
      version: ${{ steps.series.outputs.version }}
      action: ${{ steps.series.outputs.action }}
      previous: ${{ steps.series.outputs.previous }}
      compat_tag: ${{ steps.series.outputs.compat_tag }}
      prerelease: ${{ steps.series.outputs.prerelease }}
      make_latest: ${{ steps.series.outputs.make_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-preflight.mjs --tag "$RELEASE_TAG" --sha "$GITHUB_SHA" --main-ref origin/main
      - name: Resolve component and previous release
        id: series
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { execFileSync } from 'node:child_process'
          import { releaseSeries, previousRelease } from './scripts/release-series.mjs'
          const tag = process.env.RELEASE_TAG, series = releaseSeries(tag)
          const tags = execFileSync('git', ['tag', '--list'], { encoding: 'utf8' }).trim().split('\n')
          for (const [name, value] of Object.entries({ component: series.component, version: series.version, action: series.action ?? '', previous: previousRelease(tags, tag) ?? '', compat_tag: series.action ? '' : tag, prerelease: series.prerelease, make_latest: series.makeLatest })) console.log(`${name}=${value}`)
          JS
      - name: Reject unchanged tagged Actions and warn about pending Action releases
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-action-releases.mjs --tag "$RELEASE_TAG"

  verify:
    name: Verify
    needs: preflight
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      tag: ${{ needs.preflight.outputs.compat_tag }}

  release:
    name: Publish component assets
    if: needs.preflight.outputs.component == 'cli' || needs.preflight.outputs.component == 'web'
    needs: [preflight, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      COMPONENT: ${{ needs.preflight.outputs.component }}
      IS_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
      PREVIOUS_TAG: ${{ needs.preflight.outputs.previous }}
      VERDICT_JSON: ${{ needs.verify.outputs.compat_report }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci
        if: env.COMPONENT == 'web'
      - name: Package web archive and verify provenance
        if: env.COMPONENT == 'web'
        run: |
          set -euo pipefail
          npm run package:web -- --version "$RELEASE_VERSION"
          manifest=".local/releases/artifact-pages-web-v${RELEASE_VERSION}.tar.gz.json"
          jq -e --arg sha "$GITHUB_SHA" '.sourceDirty == false and .sourceCommit == $sha' "$manifest"
      - name: Package CLI binaries, notices and compatibility contract
        if: env.COMPONENT == 'cli'
        run: |
          set -euo pipefail
          node scripts/package-cli-release.mjs --version "$RELEASE_VERSION" --out .local/cli-release
          (cd .local/cli-release && sha256sum --check "artifact-pages_v${RELEASE_VERSION}_checksums.txt")
      - name: Generate component release notes
        run: |
          set -euo pipefail
          args=(--version "$RELEASE_VERSION" --component "$COMPONENT" --out "$RUNNER_TEMP/notes.md")
          if [ -n "$VERDICT_JSON" ]; then
            printf '%s' "$VERDICT_JSON" > "$RUNNER_TEMP/verdict.json"
            args+=(--verdict "$RUNNER_TEMP/verdict.json")
          fi
          if [ "$COMPONENT" = web ]; then
            args+=(--archive ".local/releases/artifact-pages-web-v${RELEASE_VERSION}.tar.gz")
            if [ -n "$PREVIOUS_TAG" ]; then
              mkdir -p "$RUNNER_TEMP/previous"
              gh release download "$PREVIOUS_TAG" --pattern 'artifact-pages-web-*.tar.gz' --dir "$RUNNER_TEMP/previous"
              previous=("$RUNNER_TEMP"/previous/*.tar.gz)
              test "${#previous[@]}" = 1
              args+=(--previous-archive "${previous[0]}" --previous-tag "$PREVIOUS_TAG")
            fi
          fi
          node scripts/release-notes.mjs "${args[@]}"
      - name: Publish only the selected component assets
        run: |
          set -euo pipefail
          if [ "$COMPONENT" = cli ]; then
            assets=(.local/cli-release/artifact-pages_v"${RELEASE_VERSION}"_*)
          else
            base=".local/releases/artifact-pages-web-v${RELEASE_VERSION}.tar.gz"
            assets=("$base" "$base.json" "$base.sha256")
          fi
          flags=(--latest="$MAKE_LATEST")
          if [ "$IS_PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag "${flags[@]}" --title "Artifact Pages $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"

  verify-published:
    name: Verify published component
    needs: [preflight, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      COMPONENT: ${{ needs.preflight.outputs.component }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download assets
        run: gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/assets"
      - name: Verify CLI checksums, binaries, notices and compatibility asset
        if: env.COMPONENT == 'cli'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do test -f "artifact-pages_v${RELEASE_VERSION}_${platform}"; done
          test -s "artifact-pages_v${RELEASE_VERSION}_THIRD_PARTY_NOTICES.txt"
          sha256sum --check "artifact-pages_v${RELEASE_VERSION}_checksums.txt"
          binary="./artifact-pages_v${RELEASE_VERSION}_linux_amd64"
          chmod +x "$binary"
          test "$("$binary" version --format json | jq -r .version)" = "$RELEASE_VERSION"
          "$binary" compatibility --format json > "$RUNNER_TEMP/compatibility.json"
          diff <(jq -S . "$RUNNER_TEMP/compatibility.json") <(jq -S . "artifact-pages_v${RELEASE_VERSION}_compatibility.json")
      - name: Deploy the config-pinned web bundle and compare bytes
        if: env.COMPONENT == 'web'
        run: |
          go build -o "$RUNNER_TEMP/artifact-pages" ./cli/cmd/artifact-pages
          node scripts/verify-release.mjs --cli "$RUNNER_TEMP/artifact-pages" --assets "$RUNNER_TEMP/assets" --version "$RELEASE_VERSION"

  sync-action:
    name: Sync selected Action repository
    if: needs.preflight.outputs.action != ''
    needs: [preflight, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_ACTION: ${{ needs.preflight.outputs.action }}
      IS_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Generate only the selected Action repository
        run: node scripts/build-action-repos.mjs --action "$RELEASE_ACTION" --version "$RELEASE_VERSION" --out "$RUNNER_TEMP/action-repos"
      - name: Verify the CLI assets pinned by the generated Action exist
        run: |
          set -euo pipefail
          cli_version="$(jq -r .version "$RUNNER_TEMP/action-repos/$RELEASE_ACTION-action/release.json")"
          mkdir -p "$RUNNER_TEMP/cli-assets"
          gh release download "v$cli_version" --pattern "artifact-pages_v${cli_version}_*" --dir "$RUNNER_TEMP/cli-assets"
          cd "$RUNNER_TEMP/cli-assets"
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do test -f "artifact-pages_v${cli_version}_${platform}"; done
          test -s "artifact-pages_v${cli_version}_THIRD_PARTY_NOTICES.txt"
          sha256sum --check "artifact-pages_v${cli_version}_checksums.txt"
      - name: Create a token scoped to the selected Action repository
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ needs.preflight.outputs.action }}-action
          permission-contents: write
      - name: Sync the generated content and plain Action tag
        env:
          ACTION_REPO_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: scripts/sync-action-repos.sh "$RUNNER_TEMP/action-repos" "$RELEASE_VERSION"
      - name: Record the Action release without marking it latest
        run: |
          set -euo pipefail
          flags=(--latest=false)
          if [ "$IS_PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag "${flags[@]}" --title "$RELEASE_TAG" --notes "Generated $RELEASE_ACTION-action; published as v$RELEASE_VERSION in its repository."
