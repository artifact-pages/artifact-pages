# Complete single-file Cloudflare verification config. This preserves the
# historical artifact-pages.stream target for callers using --config once;
# sites is the complete desired registration set, including smoke.
# Secrets remain in CF_VERIFY_* environment variables. Load them with:
#   set -a; source ~/.config/artifact-pages/verify.env; set +a
schemaVersion: 1
provider: cloudflare
cloudflare:
  accountId: 9ac354c8aa31d424224d8c4f3aa8ba2a
  zoneId: b647a1ef28dde558fa8b80b50ad0c040
  bucket: artifact-pages-verify
  publicBaseURL: https://artifact-pages.stream
  accessKeyIdEnv: CF_VERIFY_R2_ACCESS_KEY_ID
  secretAccessKeyEnv: CF_VERIFY_R2_SECRET_ACCESS_KEY
  apiTokenEnv: CF_VERIFY_API_TOKEN
sites:
  smoke:
    name: Actions smoke
    description: Verification fixture published from the OSS repository.
    repository: artifact-pages/artifact-pages
    sourcePath: fixtures/actions-smoke/site
  verify-scale-10:
    name: Scale verification · 10 files
    description: Deterministic publisher fixture.
    repository: artifact-pages/artifact-pages
    sourcePath: fixtures/scale/sites/verify-scale-10/source
  verify-scale-100:
    name: Scale verification · 100 files
    description: Deterministic publisher fixture.
    repository: artifact-pages/artifact-pages
    sourcePath: fixtures/scale/sites/verify-scale-100/source
  verify-scale-1000:
    name: Scale verification · 1,000 files
    description: Deterministic publisher fixture.
    repository: artifact-pages/artifact-pages
    sourcePath: fixtures/scale/sites/verify-scale-1000/source
  verify-scale-5000:
    name: Scale verification · 5,000 files
    description: Deterministic publisher fixture.
    repository: artifact-pages/artifact-pages
    sourcePath: fixtures/scale/sites/verify-scale-5000/source
  verify-scale-10000:
    name: Scale verification · 10,000 files
    description: Deterministic publisher fixture.
    repository: artifact-pages/artifact-pages
    sourcePath: fixtures/scale/sites/verify-scale-10000/source
